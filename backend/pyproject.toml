[project]
name = "beforeyougo"
version = "0.1.0"
description = "BeforeYouGo — event intelligence and accountability platform"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "argon2-cffi>=23.1,<26",
    "apscheduler>=3.10,<4",
    "beautifulsoup4>=4.12,<5",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "icalendar>=6.1,<7",
    "Pillow>=10,<12",
    "psycopg[binary]>=3.2,<4",
    "pydantic[email]>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "PyJWT>=2.9,<3",
    "pypdf>=5,<6",
    "python-multipart>=0.0.12,<1",
    "pytesseract>=0.3.13,<1",
    "rapidfuzz>=3.10,<4",
    "SQLAlchemy>=2.0,<3",
    "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
exclude = ["alembic/", "tests/"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
